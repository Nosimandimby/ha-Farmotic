name: Farmotic
version: "2.1.0"
slug: farmotic
description: "Application de suivi d'élevage de poulets de chair : cycles (bandes), relevés journaliers, mortalité, charges, références de croissance et indicateurs techno-économiques (indice de consommation, coût par kilo, marge)."
url: "https://github.com/Nosimandimby/Farmotic"
codenotify: true
init: false
legacy: true
arch:
  - amd64
  - armhf
  - armv7
  - aarch64
  - i386
ports:
  3001/tcp: 3001
panel_icon: mdi:chicken
panel_admin: true
options:
  port: 3001
  host: "0.0.0.0"
  auto_update: false
  no_open: true
schema:
  port: int
  host: str
  auto_update: bool
  no_open: bool
services: []
startup: once
boot: auto
build: true